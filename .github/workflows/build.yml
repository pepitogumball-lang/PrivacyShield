name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p app/build/outputs/apk/debug/renamed
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/renamed/PrivacyShield.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivacyShield
          path: app/build/outputs/apk/debug/renamed/PrivacyShield.apk
          if-no-files-found: error
          retention-days: 14
